<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>教练登录</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #000; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; -webkit-font-smoothing: antialiased; }
  .box { background: #1C1C1E; border-radius: 20px; padding: 32px 24px; width: 100%; max-width: 360px; text-align: center; color: #fff; }
  h1 { font-size: 28px; margin-bottom: 4px; }
  p { color: #8E8E93; font-size: 14px; margin-bottom: 24px; }
  input { width: 100%; padding: 14px; border: 1.5px solid #3A3A3C; border-radius: 12px; font-size: 18px; text-align: center; font-family: inherit; background: #2C2C2E; color: #fff; }
  input:focus { outline: none; border-color: #5AC8FA; }
  button { width: 100%; padding: 14px; background: #5AC8FA; color: #000; border: none; border-radius: 12px; font-size: 17px; font-weight: 600; margin-top: 12px; cursor: pointer; }
  .err { color: #FF375F; font-size: 14px; margin-top: 8px; }
</style>
</head>
<body>
<div class="box">
  <div style="font-size:48px;margin-bottom:12px;">🏃</div>
  <h1>春夏体适能</h1>
  <p>教练管理端</p>
  <form method="post">
    <input type="password" name="password" placeholder="输入管理密码" autofocus>
    <button type="submit">登录</button>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
  </form>
</div>
</body>
</html>
