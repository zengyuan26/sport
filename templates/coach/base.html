<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>{% block title %}少儿体能{% endblock %}</title>
<style>
  :root {
    --green: #34C759;
    --blue: #007AFF;
    --orange: #FF9500;
    --red: #FF3B30;
    --bg: #F2F2F7;
    --card: #FFFFFF;
    --text: #1C1C1E;
    --text2: #8E8E93;
    --sep: #E5E5EA;
    --radius: 14px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; background: var(--bg); color: var(--text); -webkit-tap-highlight-color: transparent; padding-bottom: 80px; }
  .nav { background: var(--card); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--sep); }
  .nav h1 { font-size: 18px; font-weight: 600; }
  .nav a { color: var(--blue); text-decoration: none; font-size: 15px; }
  .card { background: var(--card); border-radius: var(--radius); padding: 16px; margin: 12px 16px; }
  .card-title { font-size: 13px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .btn { display: inline-block; padding: 10px 20px; border-radius: 10px; font-size: 15px; font-weight: 500; text-decoration: none; border: none; cursor: pointer; text-align: center; }
  .btn-primary { background: var(--blue); color: #fff; }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-outline { background: none; border: 1.5px solid var(--blue); color: var(--blue); }
  .btn-sm { padding: 6px 14px; font-size: 13px; }
  .btn-block { display: block; width: 100%; }
  .tag { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: 500; }
  .tag-green { background: #D4F5DD; color: #1B7A34; }
  .tag-blue { background: #D4E8FF; color: #0055CC; }
  .tag-orange { background: #FFE5CF; color: #B05A00; }
  .input { width: 100%; padding: 10px 14px; border: 1.5px solid var(--sep); border-radius: 10px; font-size: 16px; font-family: inherit; background: var(--card); }
  .input:focus { outline: none; border-color: var(--blue); }
  .label { font-size: 13px; color: var(--text2); margin-bottom: 4px; display: block; }
  .form-group { margin-bottom: 14px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 20px; background: #F2F2F7; font-size: 13px; }
  .emoji-lg { font-size: 40px; }
  .emoji-md { font-size: 24px; }
  .mt-2 { margin-top: 8px; }
  .mb-2 { margin-bottom: 8px; }
  .text-sm { font-size: 13px; color: var(--text2); }
  .text-center { text-align: center; }
  .flex-between { display: flex; justify-content: space-between; align-items: center; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--sep); font-size: 14px; }
  th { font-size: 12px; color: var(--text2); font-weight: 500; }
  {% block extra_css %}{% endblock %}
</style>
</head>
<body>
{% if session.get('coach_ok') %}
<nav class="nav">
  <a href="/">🏠</a>
  <h1>{% block nav_title %}少儿体能{% endblock %}</h1>
  <a href="/logout">退出</a>
</nav>
{% endif %}
{% block content %}{% endblock %}
</body>
</html>
