<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>打卡 · {{ course.name }}</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', sans-serif;
    background: #000; color: #fff;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 60px 20px 40px;
    -webkit-tap-highlight-color: transparent;
  }
  .course-icon { font-size: 64px; margin-bottom: 12px; }
  .course-name { font-size: 24px; font-weight: 800; text-align: center; margin-bottom: 4px; letter-spacing: -0.3px; }
  .course-meta { font-size: 14px; color: #8E8E93; margin-bottom: 28px; text-align: center; }

  /* ── Student Grid ── */
  .student-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 360px; width: 100%; margin-bottom: 16px; }
  .student-chip {
    background: #1C1C1E; border-radius: 14px; padding: 14px 8px;
    text-align: center; cursor: pointer; border: 2px solid transparent;
    transition: all 0.15s;
  }
  .student-chip:active { transform: scale(0.95); }
  .student-chip .av { font-size: 28px; margin-bottom: 4px; }
  .student-chip .nm { font-size: 13px; font-weight: 600; }

  /* ── Search + Dropdown ── */
  .search-area { max-width: 360px; width: 100%; position: relative; }
  .search-area input {
    width: 100%; padding: 12px 14px 12px 36px; border-radius: 12px;
    border: 1.5px solid #2C2C2E; background: #1C1C1E; color: #fff;
    font-size: 16px; font-family: inherit;
  }
  .search-area input:focus { outline: none; border-color: #5AC8FA; }
  .search-area .search-icon { position: absolute; left: 12px; top: 15px; font-size: 14px; color: #636366; pointer-events: none; }
  .suggest-list {
    display: none; position: absolute; top: 48px; left: 0; right: 0;
    background: #1C1C1E; border: 1.5px solid #2C2C2E; border-radius: 14px;
    max-height: 260px; overflow-y: auto; z-index: 10;
  }
  .suggest-list.show { display: block; }
  .suggest-item {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; cursor: pointer; transition: background 0.1s;
    border-bottom: 1px solid #2C2C2E;
  }
  .suggest-item:last-child { border-bottom: none; }
  .suggest-item:active { background: #2C2C2E; }
  .suggest-item .si-emoji { font-size: 22px; width: 28px; text-align: center; }
  .suggest-item .si-photo { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
  .suggest-item .si-name { font-size: 16px; font-weight: 600; }
  .suggest-item .si-age { font-size: 12px; color: #8E8E93; margin-left: auto; }
  .suggest-empty { padding: 14px; text-align: center; color: #636366; font-size: 14px; }

  .btn-daka {
    display: block; width: 100%; max-width: 360px; margin-top: 10px;
    padding: 14px; background: #4CD964; color: #000;
    border: none; border-radius: 14px; font-size: 16px; font-weight: 700;
    cursor: pointer; font-family: inherit; transition: opacity 0.15s;
  }
  .btn-daka:active { opacity: 0.7; }

  .msg { color: #FF375F; font-size: 13px; margin-top: 8px; text-align: center; min-height: 20px; }

  /* ── Done Screen ── */
  .done-box { text-align: center; padding: 40px 20px; }
  .done-check {
    width: 80px; height: 80px; border-radius: 50%; background: #4CD964;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px; font-size: 40px; color: #000;
    animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes popIn { 0%{transform:scale(0);opacity:0} 70%{transform:scale(1.1)} 100%{transform:scale(1);opacity:1} }
  .done-name { font-size: 24px; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.3px; }
  .done-stat { font-size: 14px; color: #8E8E93; margin-bottom: 16px; }
  .done-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: #2C2C2E; padding: 10px 20px; border-radius: 20px;
    font-size: 14px; font-weight: 600;
    animation: slideUp 0.4s ease;
  }
  @keyframes slideUp { 0%{opacity:0;transform:translateY(12px)} 100%{opacity:1;transform:translateY(0)} }
  .reset-btn {
    margin-top: 28px; padding: 12px 28px; background: transparent;
    border: 1.5px solid #5AC8FA; color: #5AC8FA; border-radius: 12px;
    font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .back-link {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    color: #636366; font-size: 13px; text-decoration: none;
  }
</style>
</head>
<body>

<div id="pick-screen">
  <div class="course-icon">{{ course.icon }}</div>
  <div class="course-name">{{ course.name }}</div>
  <div class="course-meta">{{ course.age_group }} · {{ course.duration }}分钟</div>

  <div class="student-grid" id="recentGrid"></div>

  <div class="search-area">
    <span class="search-icon">🔍</span>
    <input type="text" id="name-input" placeholder="搜索学员姓名..." autofocus autocomplete="off">
    <div class="suggest-list" id="suggestList"></div>
  </div>
  <button class="btn-daka" onclick="doCheckinByName()">✓ 打卡</button>
  <div class="msg" id="msg"></div>
</div>

<div id="done-screen" style="display:none;">
  <div class="done-box">
    <div class="done-check">✓</div>
    <div class="done-name" id="done-name"></div>
    <div class="done-stat" id="done-stat"></div>
    <div id="done-badge-area"></div>
    <button class="reset-btn" onclick="reset()">继续打卡</button>
  </div>
</div>

<a href="/p/{{ student.access_code if student else '' }}" class="back-link" style="display:none;" id="homeLink">查看我的主页 →</a>

<script src="/static/student_picker.js"></script>
<script>
var lastStudentCode = '';

var allStudents = [
  {% for s in students %}
  { id: {{ s.id }}, name: '{{ s.name }}', emoji: '{{ s.avatar_emoji }}', age: '{{ s.age_group }}', photo: '{{ s.face_photo_path or "" }}' }{% if not loop.last %},{% endif %}
  {% endfor %}
];

// ── Render recent students as grid (same style as booking page) ──
function renderRecentGrid() {
  var grid = document.getElementById('recentGrid');
  if (!grid) return;
  var recent = getRecentStudents();
  if (recent.length === 0) { grid.innerHTML = ''; return; }
  var html = '';
  for (var i = 0; i < Math.min(recent.length, MAX_RECENT); i++) {
    var s = recent[i];
    html += '<div class="student-chip" onclick="pickRecent(' + s.id + ', \'' + s.name.replace(/'/g, "\\'") + '\', \'' + (s.emoji || '') + '\')">';
    html += '<div class="av">' + (s.emoji || '🧒') + '</div>';
    html += '<div class="nm">' + s.name + '</div>';
    html += '</div>';
  }
  grid.innerHTML = html;
}

function pickRecent(id, name, emoji) {
  doCheckin(id, name, emoji);
}

renderRecentGrid();

// ── Fuzzy search dropdown ──
var nameInput = document.getElementById('name-input');
var suggestList = document.getElementById('suggestList');

nameInput.addEventListener('input', function() {
  var q = this.value.trim().toLowerCase();
  if (!q) { suggestList.classList.remove('show'); return; }

  var matches = [];
  for (var i = 0; i < allStudents.length; i++) {
    var s = allStudents[i];
    if (s.name.toLowerCase().indexOf(q) >= 0 || (s.emoji && s.emoji.indexOf(q) >= 0)) {
      matches.push(s);
    }
  }

  if (matches.length === 0) {
    suggestList.innerHTML = '<div class="suggest-empty">未找到匹配学员，点下方「打卡」按输入姓名提交</div>';
  } else {
    var html = '';
    for (var j = 0; j < matches.length; j++) {
      var m = matches[j];
      html += '<div class="suggest-item" data-sid="' + m.id + '" data-sname="' + m.name + '" data-semoji="' + m.emoji + '">';
      if (m.photo) {
        html += '<img src="' + m.photo + '" class="si-photo">';
      } else {
        html += '<span class="si-emoji">' + m.emoji + '</span>';
      }
      html += '<span class="si-name">' + m.name + '</span>';
      html += '<span class="si-age">' + m.age + '</span>';
      html += '</div>';
    }
    suggestList.innerHTML = html;

    var items = suggestList.querySelectorAll('.suggest-item');
    for (var k = 0; k < items.length; k++) {
      (function(item) {
        item.addEventListener('click', function() {
          var sid = parseInt(item.getAttribute('data-sid'));
          var sname = item.getAttribute('data-sname');
          var semoji = item.getAttribute('data-semoji');
          nameInput.value = '';
          suggestList.classList.remove('show');
          doCheckin(sid, sname, semoji);
        });
      })(items[k]);
    }
  }
  suggestList.classList.add('show');
});

document.addEventListener('click', function(e) {
  if (e.target !== nameInput && !suggestList.contains(e.target)) {
    suggestList.classList.remove('show');
  }
});

async function doCheckin(sid, name, emoji) {
  document.getElementById('msg').textContent = '';
  var f = new FormData();
  f.append('student_id', sid);
  f.append('student_name', name);
  var r = await fetch('/c/{{ course.id }}/do', {method:'POST', body:f});
  var d = await r.json();
  if (d.ok) {
    recordStudentPick(sid, name, emoji || '');
    showDone(d);
  }
  else { document.getElementById('msg').textContent = d.msg; }
}

async function doCheckinByName() {
  document.getElementById('msg').textContent = '';
  var name = document.getElementById('name-input').value.trim();
  if (!name) { document.getElementById('msg').textContent = '请输入姓名'; return; }

  // Try exact match first
  var exact = null;
  for (var i = 0; i < allStudents.length; i++) {
    if (allStudents[i].name === name) { exact = allStudents[i]; break; }
  }
  if (exact) {
    nameInput.value = '';
    suggestList.classList.remove('show');
    doCheckin(exact.id, exact.name, exact.emoji);
    return;
  }

  // Fallback: submit by name string
  var f = new FormData();
  f.append('student_name', name);
  var r = await fetch('/c/{{ course.id }}/do', {method:'POST', body:f});
  var d = await r.json();
  if (d.ok) {
    document.getElementById('name-input').value = '';
    suggestList.classList.remove('show');
    showDone(d);
  } else { document.getElementById('msg').textContent = d.msg; }
}

function showDone(d) {
  document.getElementById('pick-screen').style.display = 'none';
  document.getElementById('done-screen').style.display = 'block';
  if (d.pending) {
    document.getElementById('done-name').textContent = d.student_name + ' 已提交';
    document.getElementById('done-stat').textContent = '⏳ 等待教练确认后计入出勤';
  } else {
    document.getElementById('done-name').textContent = d.student_name + ' 打卡成功';
    document.getElementById('done-stat').textContent = '累计出勤 ' + d.total + ' 次';
  }
  var area = document.getElementById('done-badge-area');
  area.innerHTML = d.new_badges > 0
    ? '<div class="done-badge">🏅 获得 ' + d.new_badges + ' 枚新奖章！</div>'
    : '';

  if (d.access_code) {
    lastStudentCode = d.access_code;
    var link = document.getElementById('homeLink');
    link.href = '/p/' + d.access_code;
    link.style.display = 'block';
  }
}

function reset() {
  document.getElementById('pick-screen').style.display = 'block';
  document.getElementById('done-screen').style.display = 'none';
  document.getElementById('homeLink').style.display = 'none';
  document.getElementById('name-input').focus();
  renderRecentGrid();
}
</script>

</body>
</html>
