<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>打卡 · {{ course.name }}</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', sans-serif;
    background: #000; color: #fff;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 60px 20px 40px;
    -webkit-tap-highlight-color: transparent;
  }
  .course-icon { font-size: 64px; margin-bottom: 12px; }
  .course-name { font-size: 24px; font-weight: 800; text-align: center; margin-bottom: 4px; letter-spacing: -0.3px; }
  .course-meta { font-size: 14px; color: #8E8E93; margin-bottom: 36px; text-align: center; }

  .pick-hint { font-size: 12px; color: #636366; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px; text-align: center; }

  .kid-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 360px; margin-bottom: 24px; }
  .kid-btn {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 18px 16px; background: #1C1C1E; border: 2px solid transparent;
    border-radius: 16px; cursor: pointer; font-size: 14px; font-weight: 600;
    font-family: inherit; color: #fff; min-width: 86px;
    transition: all 0.15s;
  }
  .kid-btn:active { border-color: #4CD964; background: #1a2e1e; transform: scale(0.96); }
  .kid-btn .avatar {
    width: 48px; height: 48px; border-radius: 50%; object-fit: cover;
  }
  .kid-btn .emoji { font-size: 40px; }

  .or-divider {
    display: flex; align-items: center; gap: 12px; width: 100%; max-width: 320px;
    color: #636366; font-size: 12px; margin-bottom: 16px;
  }
  .or-divider::before, .or-divider::after { content:''; flex:1; height:1px; background:#2C2C2E; }

  .input-row { display: flex; gap: 8px; max-width: 320px; width: 100%; }
  .input-row input {
    flex: 1; padding: 16px; border: 2px solid #2C2C2E; border-radius: 14px;
    font-size: 18px; text-align: center; font-family: inherit;
    background: #1C1C1E; color: #fff;
  }
  .input-row input:focus { outline: none; border-color: #5AC8FA; }
  .input-row input::placeholder { color: #636366; }
  .input-row button {
    padding: 16px 24px; background: #4CD964; color: #000;
    border: none; border-radius: 14px; font-size: 16px; font-weight: 700;
    cursor: pointer; font-family: inherit; transition: opacity 0.15s;
  }
  .input-row button:active { opacity: 0.7; }

  .msg { color: #FF375F; font-size: 13px; margin-top: 8px; text-align: center; min-height: 20px; }

  /* ── Done Screen ── */
  .done-box { text-align: center; padding: 40px 20px; }
  .done-check {
    width: 80px; height: 80px; border-radius: 50%; background: #4CD964;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px; font-size: 40px; color: #000;
    animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes popIn { 0%{transform:scale(0);opacity:0} 70%{transform:scale(1.1)} 100%{transform:scale(1);opacity:1} }
  .done-name { font-size: 24px; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.3px; }
  .done-stat { font-size: 14px; color: #8E8E93; margin-bottom: 16px; }
  .done-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: #2C2C2E; padding: 10px 20px; border-radius: 20px;
    font-size: 14px; font-weight: 600;
    animation: slideUp 0.4s ease;
  }
  @keyframes slideUp { 0%{opacity:0;transform:translateY(12px)} 100%{opacity:1;transform:translateY(0)} }
  .reset-btn {
    margin-top: 28px; padding: 12px 28px; background: transparent;
    border: 1.5px solid #5AC8FA; color: #5AC8FA; border-radius: 12px;
    font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .back-link {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    color: #636366; font-size: 13px; text-decoration: none;
  }
</style>
</head>
<body>

<div id="pick-screen">
  <div class="course-icon">{{ course.icon }}</div>
  <div class="course-name">{{ course.name }}</div>
  <div class="course-meta">{{ course.age_group }} · {{ course.duration }}分钟</div>

  {% if students %}
  <div class="pick-hint">选择学员打卡</div>
  <div class="kid-grid">
    {% for s in students %}
    <button class="kid-btn" onclick="doCheckin({{ s.id }}, '{{ s.name }}')">
      {% if s.face_photo_path %}
      <img src="{{ s.face_photo_path }}" class="avatar">
      {% else %}
      <span class="emoji">{{ s.avatar_emoji }}</span>
      {% endif %}
      {{ s.name }}
    </button>
    {% endfor %}
  </div>
  {% endif %}

  <div class="or-divider">或手动输入</div>
  <div class="input-row">
    <input type="text" id="name-input" placeholder="输入学员姓名" autofocus>
    <button onclick="doCheckinByName()">打卡</button>
  </div>
  <div class="msg" id="msg"></div>
</div>

<div id="done-screen" style="display:none;">
  <div class="done-box">
    <div class="done-check">✓</div>
    <div class="done-name" id="done-name"></div>
    <div class="done-stat" id="done-stat"></div>
    <div id="done-badge-area"></div>
    <button class="reset-btn" onclick="reset()">继续打卡</button>
  </div>
</div>

<a href="/p/{{ student.access_code if student else '' }}" class="back-link" style="display:none;" id="homeLink">查看我的主页 →</a>

<script>
var lastStudentCode = '';

async function doCheckin(sid, name) {
  document.getElementById('msg').textContent = '';
  var f = new FormData();
  f.append('student_id', sid);
  f.append('student_name', name);
  var r = await fetch('/c/{{ course.id }}/do', {method:'POST', body:f});
  var d = await r.json();
  if (d.ok) { showDone(d); }
  else { document.getElementById('msg').textContent = d.msg; }
}

async function doCheckinByName() {
  document.getElementById('msg').textContent = '';
  var name = document.getElementById('name-input').value.trim();
  if (!name) { document.getElementById('msg').textContent = '请输入姓名'; return; }
  var f = new FormData();
  f.append('student_name', name);
  var r = await fetch('/c/{{ course.id }}/do', {method:'POST', body:f});
  var d = await r.json();
  if (d.ok) {
    document.getElementById('name-input').value = '';
    showDone(d);
  } else { document.getElementById('msg').textContent = d.msg; }
}

function showDone(d) {
  document.getElementById('pick-screen').style.display = 'none';
  document.getElementById('done-screen').style.display = 'block';
  if (d.pending) {
    document.getElementById('done-name').textContent = d.student_name + ' 已提交';
    document.getElementById('done-stat').textContent = '⏳ 等待教练确认后计入出勤';
  } else {
    document.getElementById('done-name').textContent = d.student_name + ' 打卡成功';
    document.getElementById('done-stat').textContent = '累计出勤 ' + d.total + ' 次';
  }
  var area = document.getElementById('done-badge-area');
  area.innerHTML = d.new_badges > 0
    ? '<div class="done-badge">🏅 获得 ' + d.new_badges + ' 枚新奖章！</div>'
    : '';

  if (d.access_code) {
    lastStudentCode = d.access_code;
    var link = document.getElementById('homeLink');
    link.href = '/p/' + d.access_code;
    link.style.display = 'block';
  }
}

function reset() {
  document.getElementById('pick-screen').style.display = 'block';
  document.getElementById('done-screen').style.display = 'none';
  document.getElementById('homeLink').style.display = 'none';
  document.getElementById('name-input').focus();
}
</script>

</body>
</html>
